<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyGame - Game Online</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #12122b 0%, #05050f 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
        }
        .pygame-container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }
        .pygame-box {
            background: rgba(11,11,30,0.9);
            border: 2px solid #00ffe0;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,255,224,0.1);
        }
        .pygame-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 28px;
            color: #00ffe0;
            text-shadow: 0 0 20px rgba(0,255,224,0.3);
            margin-bottom: 10px;
        }
        .pygame-sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .game-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
        }
        .game-card:hover {
            border-color: #00ffe0;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,255,224,0.1);
        }
        .game-card .icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .game-card .name { font-size: 18px; font-weight: 600; color: #00ffe0; }
        .game-card .desc { font-size: 13px; color: #888; margin-top: 5px; }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid #ff2d9d;
            color: #ff2d9d;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
        }
        .back-btn:hover {
            background: #ff2d9d;
            color: #fff;
        }
        @media (max-width: 600px) {
            .game-grid { grid-template-columns: 1fr; }
            .pygame-box { padding: 20px; }
            .pygame-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="pygame-container">
        <div class="pygame-box">
            <h1 class="pygame-title">🎮 PYGAME</h1>
            <p class="pygame-sub">Chọn game để bắt đầu chơi</p>
            
            <div class="game-grid">
                <a href="snake.html" class="game-card">
                    <span class="icon">🐍</span>
                    <span class="name">Rắn săn táo</span>
                    <span class="desc">Điều khiển rắn ăn táo kiếm xu</span>
                </a>
                <a href="wordchain.html" class="game-card">
                    <span class="icon">🔤</span>
                    <span class="name">Nối từ</span>
                    <span class="desc">Ghép từ với người chơi khác</span>
                </a>
            </div>
            
            <a href="../" class="back-btn">← Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
