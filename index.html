<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Tài Khoản</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div id="app">
        <!-- ===== LOGIN FORM ===== -->
        <div id="login-form" class="login-wrapper">
            <div class="login-box">
                <div class="logo">
                    <h1>Đăng nhập <span>Hệ Thống</span></h1>
                    <p>Quản lý tài khoản an toàn & bảo mật</p>
                </div>

                <div id="login-alert" class="alert" style="display:none;"></div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập">
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu">
                </div>

                <button onclick="login()" class="btn btn-primary">Đăng nhập</button>

                <div class="divider">
                    <span>hoặc</span>
                </div>

                <button onclick="showTokenLogin()" class="btn btn-secondary">Đăng nhập bằng token</button>
            </div>
        </div>

        <!-- ===== TOKEN LOGIN FORM ===== -->
        <div id="token-login-form" class="login-wrapper" style="display:none">
            <div class="login-box">
                <div class="logo">
                    <h1>Đăng nhập <span>bằng Token</span></h1>
                    <p>Nhập mã token của bạn để truy cập</p>
                </div>

                <div class="form-group">
                    <label>Token của bạn</label>
                    <input type="text" id="token-input" placeholder="Nhập token">
                </div>

                <button onclick="loginWithToken()" class="btn btn-primary">Xác nhận</button>

                <div class="back-link">
                    <button onclick="showLogin()">← Quay lại</button>
                </div>
            </div>
        </div>

        <!-- ===== DASHBOARD ===== -->
        <div id="dashboard" style="display:none">
            <nav class="navbar">
                <div class="nav-menu">
                    <button onclick="showPage('home')" class="nav-btn active">🏠 Trang Chủ</button>
                    <button onclick="showPage('management')" id="management-tab" class="nav-btn" style="display:none">⚙️ Quản Lý</button>
                    <button onclick="showPage('settings')" class="nav-btn">🔧 Cài Đặt</button>
                </div>
                <div class="user-info">
                    <span id="current-user"></span>
                    <span id="user-role" class="badge"></span>
                </div>
            </nav>
            <div id="content"></div>
        </div>
    </div>

    <!-- Load Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Load JavaScript files -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
