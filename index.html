<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên quân</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login Form -->
        <div id="login-form" class="container">
            <h2>Đăng Nhập</h2>
            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>
            <button onclick="login()" class="btn btn-primary">OK</button>
            <button onclick="showTokenLogin()" class="btn btn-secondary">Đăng nhập bằng token</button>
        </div>

        <!-- Token Login Form -->
        <div id="token-login-form" class="container" style="display:none">
            <h2>Đăng Nhập Bằng Token</h2>
            <div class="form-group">
                <label>Token của bạn:</label>
                <input type="text" id="token-input" placeholder="Nhập token">
            </div>
            <button onclick="loginWithToken()" class="btn btn-primary">OK</button>
            <button onclick="showLogin()" class="btn btn-secondary">Quay lại</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display:none">
            <nav class="navbar">
                <div class="nav-menu">
                    <button onclick="showPage('home')" class="nav-btn">Trang Chủ</button>
                    <button onclick="showPage('management')" id="management-tab" class="nav-btn" style="display:none">Quản Lí</button>
                    <button onclick="showPage('settings')" class="nav-btn">Cài Đặt</button>
                </div>
                <div class="user-info">
                    <span id="current-user"></span>
                    <span id="user-role" class="badge"></span>
                </div>
            </nav>
            <div id="content">
                <!-- Pages will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Load Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Load JavaScript files -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
