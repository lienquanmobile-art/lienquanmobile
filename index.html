<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBlack</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="loginPage" class="page active">
            <div class="login-container">
                <h1>ĐĂNG NHẬP</h1>
                <div class="login-form">
                    <div class="input-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập">
                    </div>
                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu">
                    </div>
                    <button onclick="handleLogin()" class="btn-primary">OK</button>
                    <button onclick="showTokenLogin()" class="btn-secondary">Đăng nhập bằng token</button>
                </div>
            </div>
        </div>

        <!-- Token Login Page -->
        <div id="tokenLoginPage" class="page">
            <div class="login-container">
                <h1>ĐĂNG NHẬP BẰNG TOKEN</h1>
                <div class="login-form">
                    <div class="input-group">
                        <label>Token của bạn</label>
                        <input type="text" id="tokenInput" placeholder="Nhập token">
                    </div>
                    <button onclick="handleTokenLogin()" class="btn-primary">OK</button>
                    <button onclick="showMainLogin()" class="btn-secondary">Quay lại</button>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainApp" class="page">
            <nav class="navbar">
                <div class="nav-container">
                    <div class="nav-brand">WebBlack</div>
                    <div class="nav-links" id="navLinks">
                        <!-- Dynamic navigation -->
                    </div>
                    <div class="nav-user">
                        <span id="userDisplay"></span>
                    </div>
                </div>
            </nav>
            <div class="content" id="contentArea">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
